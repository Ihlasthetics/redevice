name: Frontend checks

on:
  push:
    branches-ignore:
      - main
      - developer
  pull_request:
    paths:
      - ".github/workflows/frontend-checks.yml"
      - "package.json"
      - "package-lock.json"
      - "web/**"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npx --yes npm@11.6.2 ci
      - run: npx --yes npm@11.6.2 run format:check
      - run: npx --yes npm@11.6.2 run typecheck
      - run: npx --yes npm@11.6.2 test
      - run: npx --yes npm@11.6.2 run build
      - name: Dependency audit (high and critical)
        run: npx --yes npm@11.6.2 audit --audit-level=high
